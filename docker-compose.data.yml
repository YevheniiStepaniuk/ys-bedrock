# Data stack: PostgreSQL + Redis.
# Separate compose project so edge/app deploys never recreate the databases.
# Owns the `internal` network; other stacks join it as `external: true`.
#
#   docker compose -f docker-compose.data.yml up -d

name: data

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  # Backend-only: Postgres, Redis, and apps that talk to them.
  # `internal: true` = no route to the internet. Containers that need egress
  # (e.g. bots calling the Telegram API, backup sidecar pushing to R2) must
  # also join `proxy`.
  internal:
    name: internal
    internal: true

# Fixed names (not project-prefixed) so renaming the project never orphans data.
volumes:
  postgres-data:
    name: postgres-data
  redis-data:
    name: redis-data

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    # Tuned for 8 GB host shared with apps (~25% shared_buffers, ~60% cache hint).
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=5GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=100
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - wal_buffers=16MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - log_min_duration_statement=500
    shm_size: 512mb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Never public. Bound to Tailscale IP only, for DBeaver etc.
    ports:
      - "${TAILSCALE_IP:?TAILSCALE_IP is required}:5432:5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - redis-data:/data
    # No ports: reachable only from the `internal` network.
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 640M
