# Data stack: PostgreSQL + Redis (+ optional pg-backup -> Cloudflare R2, profile `backup`).
# Separate compose project so edge/app deploys never recreate the databases.
# Owns the `internal` network; other stacks join it as `external: true`.
#
#   docker compose -f docker-compose.data.yml up -d

name: data

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  # Backend-only: Postgres, Redis, and apps that talk to them.
  # `internal: true` = no route to the internet. App containers that need egress
  # (e.g. bots calling the Telegram API) also join `proxy`; pg-backup uses `backup-egress`.
  internal:
    name: internal
    internal: true
  # Docker ignores `ports:` for containers attached ONLY to an internal network.
  # Services that publish on TAILSCALE_IP (postgres, DB UIs) also join this one.
  # Masquerade off = inbound published ports work, but no outbound internet (no SNAT).
  tailnet:
    name: tailnet
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
  # Outbound-only network for pg-backup to reach R2 (nothing published on it).
  backup-egress:
    name: backup-egress

# Fixed names (not project-prefixed) so renaming the project never orphans data.
volumes:
  postgres-data:
    name: postgres-data
  redis-data:
    name: redis-data

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    # Tuned for 8 GB host shared with apps (~25% shared_buffers, ~60% cache hint).
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=5GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=100
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - wal_buffers=16MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - log_min_duration_statement=500
    shm_size: 512mb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Never public. Bound to Tailscale IP only, for DBeaver etc.
    ports:
      - "${TAILSCALE_IP:?TAILSCALE_IP is required}:5432:5432"
    networks:
      - internal
      - tailnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - redis-data:/data
    # No ports: reachable only from the `internal` network.
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 640M

  # Daily encrypted pg_dump of every database -> Cloudflare R2. See docs/backups.md.
  # Opt-in: add `backup` to COMPOSE_PROFILES in .env once R2_* + BACKUP_PASSPHRASE are set.
  pg-backup:
    build: ./backup
    image: ys/pg-backup:local
    container_name: pg-backup
    profiles: [backup]
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}       # override only for testing (e.g. MinIO)
      R2_PROVIDER: ${R2_PROVIDER:-Cloudflare}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      BACKUP_PREFIX: ${BACKUP_PREFIX:-postgres}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_ON_START: ${BACKUP_ON_START:-false}
      BACKUP_PING_URL: ${BACKUP_PING_URL:-}
      TZ: UTC
    networks:
      - internal
      - backup-egress
    deploy:
      resources:
        limits:
          memory: 256M
