# Tools stack: web UIs for PostgreSQL (pgweb) and Redis (Redis Commander).
# Published ONLY on the Tailscale IP, plus HTTP basic auth as a second layer.
# Needs the data stack (owns `internal` + `tailnet` networks) to be up first.
#
#   docker compose -f docker-compose.tools.yml up -d

name: tools

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  internal:
    external: true   # reach postgres / redis
  tailnet:
    external: true   # needed so `ports:` actually publish (no internet egress)

services:
  pgweb:
    image: sosedoff/pgweb:0.17.0
    container_name: pgweb
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    environment:
      PGWEB_DATABASE_URL: postgres://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB is required}?sslmode=disable
      PGWEB_AUTH_USER: ${TOOLS_USER:?TOOLS_USER is required}
      PGWEB_AUTH_PASS: ${TOOLS_PASSWORD:?TOOLS_PASSWORD is required}
    command:
      - /usr/bin/pgweb
      - --bind=0.0.0.0
      - --listen=8081
      - --lock-session    # UI can't switch to another DB server
      - --no-ssh          # no SSH tunnels from the UI
      - --skip-open
    ports:
      - "${TAILSCALE_IP:?TAILSCALE_IP is required}:8082:8081"
    networks:
      - internal
      - tailnet
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8081 || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64M

  redis-commander:
    image: ghcr.io/joeferner/redis-commander:0.9.1
    container_name: redis-commander
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    environment:
      REDIS_HOSTS: ys:redis:6379:0:${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      HTTP_USER: ${TOOLS_USER:?TOOLS_USER is required}
      HTTP_PASSWORD: ${TOOLS_PASSWORD:?TOOLS_PASSWORD is required}
      PORT: "8081"
    ports:
      - "${TAILSCALE_IP:?TAILSCALE_IP is required}:8083:8081"
    networks:
      - internal
      - tailnet
    deploy:
      resources:
        limits:
          memory: 128M
