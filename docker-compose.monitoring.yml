# Monitoring stack: Beszel (resource stats) + Dozzle (live logs).
# Ultra-light (~100 MB RAM total). UIs published ONLY on the Tailscale IP.
#
#   docker compose -f docker-compose.monitoring.yml up -d
#
# Beszel agent is behind the `agent` profile because it needs KEY + TOKEN that the
# hub generates on first start. Enable with COMPOSE_PROFILES=agent in .env
# (see docs/monitoring.md).

name: monitoring

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

volumes:
  beszel-data:
    name: beszel-data
  beszel-agent-data:
    name: beszel-agent-data
  # Unix socket shared hub <-> agent: no network port for the agent at all.
  beszel-socket:
    name: beszel-socket

services:
  beszel:
    image: henrygd/beszel:0.21.2
    container_name: beszel
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    environment:
      APP_URL: http://${TAILSCALE_IP:?TAILSCALE_IP is required}:8090
    ports:
      - "${TAILSCALE_IP:?TAILSCALE_IP is required}:8090:8090"
    volumes:
      - beszel-data:/beszel_data
      - beszel-socket:/beszel_socket
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M

  beszel-agent:
    image: henrygd/beszel-agent:0.21.2
    container_name: beszel-agent
    profiles: [agent]
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    # Host network = real host NIC/disk stats. It listens on a unix socket, not a port.
    network_mode: host
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: http://${TAILSCALE_IP:?TAILSCALE_IP is required}:8090
      KEY: ${BESZEL_AGENT_KEY:-}
      TOKEN: ${BESZEL_AGENT_TOKEN:-}
    volumes:
      - beszel-agent-data:/var/lib/beszel-agent
      - beszel-socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "/agent", "health"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64M

  dozzle:
    image: amir20/dozzle:v11.5.0
    container_name: dozzle
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    environment:
      DOZZLE_HOSTNAME: ys-vps
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_ENABLE_ACTIONS: "false"   # read-only: no start/stop/restart from the UI
      DOZZLE_ENABLE_SHELL: "false"     # no exec into containers from the UI
    ports:
      - "${TAILSCALE_IP:?TAILSCALE_IP is required}:8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64M
