name: Deploy infra

on:
  push:
    branches: [main]
    paths:
      - docker-compose.yml
      - docker-compose.data.yml
      - docker-compose.monitoring.yml
      - docker-compose.tools.yml
      - docker-compose.apps.yml
      - traefik/**
      - backup/**
      - .github/workflows/deploy-infra.yml
  workflow_dispatch:
    inputs:
      stacks:
        description: 'Stacks to deploy: "all" or space-separated subset of: data edge monitoring tools apps'
        default: all
        required: true

# Shared with bootstrap-host: never run two VPS jobs at once; queue, never cancel mid-flight.
concurrency:
  group: vps
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_DIR: /opt/ys-infra

jobs:
  # Decide which stacks actually changed. Only those get `pull` + `up`.
  changes:
    name: Detect changed stacks
    runs-on: ubuntu-latest
    outputs:
      stacks: ${{ steps.pick.outputs.stacks }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            data:
              - docker-compose.data.yml
              - backup/**
            edge:
              - docker-compose.yml
              - traefik/**
            monitoring:
              - docker-compose.monitoring.yml
            tools:
              - docker-compose.tools.yml
            apps:
              - docker-compose.apps.yml
            all:
              - .github/workflows/deploy-infra.yml

      - name: Pick stacks
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ inputs.stacks }}
          CHANGED: ${{ join(fromJSON(steps.filter.outputs.changes || '[]'), ' ') }}
        run: |
          ORDER="data edge monitoring tools apps"
          if [ "$EVENT" = "workflow_dispatch" ]; then WANT="$INPUT"; else WANT="$CHANGED"; fi
          case " $WANT " in *" all "*) WANT="$ORDER" ;; esac
          for s in $WANT; do
            case " $ORDER " in *" $s "*) ;; *) echo "::error::Unknown stack '$s' (allowed: $ORDER)"; exit 1 ;; esac
          done
          # Keep dependency order regardless of input order.
          PICKED=""
          for s in $ORDER; do
            case " $WANT " in *" $s "*) PICKED="$PICKED $s" ;; esac
          done
          PICKED="${PICKED# }"
          echo "stacks=$PICKED" >> "$GITHUB_OUTPUT"
          echo "### Stacks to deploy: ${PICKED:-none}" >> "$GITHUB_STEP_SUMMARY"
          echo "Stacks to deploy: ${PICKED:-none}"

  validate:
    name: Validate config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose stacks
        env:
          # Dummy values: only checks syntax/interpolation, real values live in .env on the VPS.
          TAILSCALE_IP: 100.64.0.1
          ACME_EMAIL: ci@example.com
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
          REDIS_PASSWORD: ci
          TOOLS_USER: ci
          TOOLS_PASSWORD: ci
        run: |
          for f in docker-compose.data.yml docker-compose.yml docker-compose.monitoring.yml docker-compose.tools.yml docker-compose.apps.yml; do
            docker compose -f "$f" config -q
            echo "ok: $f"
          done

      - name: Lint backup scripts
        working-directory: backup
        run: shellcheck -x -s sh ./*.sh

      - name: Build backup image
        run: docker build -q -t ys/pg-backup:ci backup

      - name: Validate Traefik dynamic config (YAML)
        run: |
          for f in traefik/dynamic/*.yml; do
            python3 -c "import sys, yaml; yaml.safe_load(open(sys.argv[1]))" "$f"
            echo "ok: $f"
          done

  deploy:
    name: Deploy (${{ needs.changes.outputs.stacks }})
    needs: [changes, validate]
    if: needs.changes.outputs.stacks != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # Upload into a staging dir; `rm: true` wipes ONLY the staging dir, never .env.
      - name: Upload infra files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          source: docker-compose.yml,docker-compose.data.yml,docker-compose.monitoring.yml,docker-compose.tools.yml,docker-compose.apps.yml,traefik,backup
          target: ${{ env.DEPLOY_DIR }}/.deploy/incoming
          rm: true

      - name: Apply and restart changed services
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_DIR: ${{ env.DEPLOY_DIR }}
          DEPLOY_STACKS: ${{ needs.changes.outputs.stacks }}
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          envs: DEPLOY_DIR,DEPLOY_STACKS
          command_timeout: 10m
          script: |
            set -euo pipefail
            cd "$DEPLOY_DIR"

            INCOMING=.deploy/incoming
            PREVIOUS=.deploy/previous
            # All stack files (validated + installed every time so server mirrors the repo).
            ALL_STACKS="docker-compose.data.yml docker-compose.yml docker-compose.monitoring.yml docker-compose.tools.yml docker-compose.apps.yml"
            FILES="docker-compose.data.yml docker-compose.yml docker-compose.monitoring.yml docker-compose.tools.yml docker-compose.apps.yml traefik backup"

            if [ ! -f .env ]; then
              echo "::error::$DEPLOY_DIR/.env missing on server"; exit 1
            fi

            # Only changed stacks get pull + up. Order (from CI) already respects dependencies:
            # data owns `internal` + `tailnet`, edge owns `proxy`; tools needs data; apps needs edge.
            STACKS=""
            for s in $DEPLOY_STACKS; do
              case "$s" in
                data)       STACKS="$STACKS docker-compose.data.yml" ;;
                edge)       STACKS="$STACKS docker-compose.yml" ;;
                monitoring) STACKS="$STACKS docker-compose.monitoring.yml" ;;
                tools)      STACKS="$STACKS docker-compose.tools.yml" ;;
                apps)       STACKS="$STACKS docker-compose.apps.yml" ;;
                *) echo "::error::Unknown stack '$s'"; exit 1 ;;
              esac
            done
            echo "Deploying stacks: $DEPLOY_STACKS"

            # Pull + recreate only services whose config/image changed; wait for healthchecks.
            # Explicit `|| return 1`: set -e is disabled inside functions called from `if`.
            up_all() {
              for f in $STACKS; do
                [ -f "$f" ] || continue
                echo "::group::up $f"
                # --ignore-buildable: locally built images (pg-backup) are built by `up --build`.
                docker compose -f "$f" pull --quiet --ignore-buildable || return 1
                docker compose -f "$f" up -d --build --remove-orphans --wait --wait-timeout 180 || return 1
                docker compose -f "$f" ps
                echo "::endgroup::"
              done
            }

            # 1. Validate ALL new stack files against the REAL .env before touching anything.
            for f in $ALL_STACKS; do
              docker compose -f "$INCOMING/$f" --env-file .env --project-directory . config -q
            done

            # 2. Snapshot current config for rollback.
            rm -rf "$PREVIOUS" && mkdir -p "$PREVIOUS"
            for x in $FILES; do
              if [ -e "$x" ]; then cp -a "$x" "$PREVIOUS/"; fi
            done

            # 3. Install new config (replaced whole so deleted files disappear too).
            for x in $FILES; do
              rm -rf "$x" && cp -a "$INCOMING/$x" "$x"
            done

            # 4. Bring stacks up; roll back on failure.
            if ! up_all; then
              echo "::error::Deploy unhealthy, rolling back"
              for f in $STACKS; do docker compose -f "$f" logs --tail 30 || true; done
              if [ -f "$PREVIOUS/docker-compose.yml" ]; then
                for x in $FILES; do
                  if [ -e "$PREVIOUS/$x" ]; then rm -rf "$x"; cp -a "$PREVIOUS/$x" "$x"; fi
                done
                up_all || true
              else
                echo "No previous config (first deploy) - nothing to roll back to"
              fi
              exit 1
            fi

            docker image prune -f
