# Core stack: Traefik (edge), PostgreSQL, Redis.
# Apps (API, PWA, bots) are added later and attach to the `proxy` / `internal` networks.

name: ys

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  # Web-facing: Traefik + any service that Traefik routes to.
  proxy:
    name: proxy
  # Backend-only: Postgres, Redis, and apps that talk to them.
  # `internal: true` = no route to the internet. Containers that need egress
  # (e.g. bots calling the Telegram API, backup sidecar pushing to R2) must
  # also join `proxy`.
  internal:
    name: internal
    internal: true

volumes:
  traefik-certs:
  postgres-data:
  redis-data:

services:
  traefik:
    image: traefik:v3.4
    container_name: traefik
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    command:
      # Providers
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=proxy
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      # Entrypoints: 80 -> 443 redirect, TLS on 443 via Let's Encrypt by default
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=le
      - --entrypoints.websecure.http3=false
      # Let's Encrypt (HTTP-01 challenge)
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?ACME_EMAIL is required}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      # Dashboard on :8080 — published ONLY on the Tailscale IP (see ports)
      - --api.dashboard=true
      - --api.insecure=true
      - --ping=true
      - --log.level=INFO
      - --accesslog=true
      - --accesslog.bufferingsize=100
      - --global.sendanonymoususage=false
      - --global.checknewversion=false
    ports:
      - "80:80"
      - "443:443"
      - "${TAILSCALE_IP:?TAILSCALE_IP is required}:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/letsencrypt
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    # Tuned for 8 GB host shared with apps (~25% shared_buffers, ~60% cache hint).
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=5GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=100
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - wal_buffers=16MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - log_min_duration_statement=500
    shm_size: 512mb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Never public. Bound to Tailscale IP only, for DBeaver etc.
    ports:
      - "${TAILSCALE_IP:?TAILSCALE_IP is required}:5432:5432"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - redis-data:/data
    # No ports: reachable only from the `internal` network.
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 640M
