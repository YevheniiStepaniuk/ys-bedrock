# Edge stack: Traefik (reverse proxy + Let's Encrypt).
# Owns the `proxy` network; app stacks join it as `external: true`.
# Databases live in docker-compose.data.yml (separate project).
#
#   docker compose up -d

name: edge

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  # Web-facing: Traefik + any service that Traefik routes to.
  proxy:
    name: proxy

volumes:
  traefik-certs:
    name: traefik-certs

services:
  traefik:
    image: traefik:v3.6   # >=3.6.1 negotiates Docker API; 3.4 speaks 1.24, rejected by Docker 29+
    container_name: traefik
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    command:
      # Providers
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=proxy
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      # Entrypoints: 80 -> 443 redirect, TLS on 443 via Let's Encrypt by default
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=le
      - --entrypoints.websecure.http3=false
      # Let's Encrypt (HTTP-01 challenge)
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?ACME_EMAIL is required}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      # Dashboard on :8080 — published ONLY on the Tailscale IP (see ports)
      - --api.dashboard=true
      - --api.insecure=true
      - --ping=true
      - --log.level=INFO
      - --accesslog=true
      - --accesslog.bufferingsize=100
      - --global.sendanonymoususage=false
      - --global.checknewversion=false
    ports:
      - "80:80"
      - "443:443"
      - "${TAILSCALE_IP:?TAILSCALE_IP is required}:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/letsencrypt
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
